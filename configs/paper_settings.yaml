# Settings reported in the manuscript. This is a record for reproducibility;
# the original second-stage train.py scripts use their own in-file constants.
model:
  backbone_channels_full: [96, 96, 128, 256, 256]
  dpi_resolution_scales: [1, 0.5, 0.25]
  nar_cascade_levels: 5
  dpi_iterations:
    kitti: 4
    nyu: 6
datasets:
  kitti:
    input_height: 256
    input_width: 1216
  nyu:
    input_height: 240
    input_width: 320
    validation_sparse_samples: 500
training:
  optimizer: AdamW
  betas: [0.9, 0.999]
  ema_decay_reported: 0.999
  stages:
    kitti:
      first:
        learning_rate: 0.00015
        batch_size: 4
        epochs: 30
        early_stopping_patience: 20
        weight_decay: 0.02
        schedule: polynomial
        warmup_epochs: 0.1
      second:
        learning_rate: 0.0002
        batch_size: 8
        epochs: 20
        early_stopping_patience: 10
        weight_decay: 0.05
        schedule: cosine
        warmup_epochs: 2
    nyu:
      first:
        learning_rate: 0.00015
        batch_size: 8
        epochs: 40
        early_stopping_patience: 30
        weight_decay: 0.02
        schedule: polynomial
        warmup_epochs: 0.1
      second:
        learning_rate: 0.00015
        batch_size: 16
        epochs: 20
        early_stopping_patience: 10
        weight_decay: 0.05
        schedule: cosine
        warmup_epochs: 2
